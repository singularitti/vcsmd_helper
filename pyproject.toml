[project]
name = "vcsmd-helper"
version = "0.1.0"
description = "A Python equivalent implementation "
readme = "README.md"
authors = [
    { name = "singularitti", email = "singularitti@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
]

[project.scripts]
vcsmd-helper = "vcsmd_helper:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
